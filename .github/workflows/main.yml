name: TVCharts Daily Bot

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Kodları Çek
      uses: actions/checkout@v4 # v3'ten v4'e güncellendi
      with:
        persist-credentials: true

    - name: Python Kurulumu
      uses: actions/setup-python@v5 # v4'ten v5'e güncellendi
      with:
        python-version: '3.12'

    - name: Gerekli Kütüphaneleri Yükle
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Sistemi Çalıştır
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: |
        python main_runner.py

    - name: Verileri Kaydet ve Depoya Gönder
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        mkdir -p data
        git add data/*.json
        git commit -m "Auto: Günlük veri kaydedildi [$(date +'%Y-%m-%d')]" || exit 0
        git push
